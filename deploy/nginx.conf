# /etc/nginx/sites-available/pokedex-tcg
# The front door: serves the built app straight from the current release and
# passes /api to the Node service, which only listens on the server itself.
# The app's own login is the lock; certbot adds HTTPS (deploy/README.md, part 5).
# Put your own domain in server_name.
server {
    listen 80;
    listen [::]:80;
    server_name pokedex.example.com;

    root /var/www/pokedex-tcg/current/dist;
    index index.html;

    # Security headers. Locations below use `expires`, not add_header, so
    # these are inherited everywhere.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # The API (systemd service pokedex-tcg). Same port as API_PORT in
    # /var/www/pokedex-tcg/shared/.env.
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset name, so they never change.
    location /assets/ {
        expires max;
        access_log off;
    }

    # The Pokémon artwork (public/pokemon/) doesn't change either. Cached, so
    # the Pokédex doesn't ask about every image again each time it shows.
    location /pokemon/ {
        expires 30d;
        access_log off;
    }

    # SPA routing; HTML is never cached, so a deploy shows up immediately.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
